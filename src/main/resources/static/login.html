<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VanProtege - Login</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#0f172a,#1e3a8a,#16a34a);
        }

        .container{
            width:100%;
            max-width:420px;
            padding:20px;
        }

        .card{
            background:white;
            border-radius:22px;
            padding:40px 30px;
            box-shadow:0 20px 50px rgba(0,0,0,.25);
        }

        .logo{
            text-align:center;
            margin-bottom:25px;
        }

        .logo h1{
            font-size:34px;
            color:#1e3a8a;
        }

        .logo span{
            color:#16a34a;
        }

        .logo p{
            font-size:14px;
            color:#666;
            margin-top:8px;
        }

        .group{
            margin-bottom:18px;
        }

        label{
            display:block;
            font-size:14px;
            font-weight:bold;
            margin-bottom:6px;
            color:#111;
        }

        input{
            width:100%;
            padding:14px;
            border:1px solid #ddd;
            border-radius:12px;
            outline:none;
            font-size:15px;
        }

        input:focus{
            border-color:#1e3a8a;
            box-shadow:0 0 0 3px rgba(30,58,138,.12);
        }

        .row{
            display:flex;
            justify-content:space-between;
            align-items:center;
            font-size:14px;
            margin-bottom:18px;
        }

        .row label{
            display:flex;
            align-items:center;
            gap:8px;
            font-weight:normal;
            margin:0;
        }

        .row input[type="checkbox"]{
            width:auto;
            padding:0;
        }

        .row a{
            text-decoration:none;
            color:#16a34a;
            font-weight:bold;
        }

        button{
            width:100%;
            padding:15px;
            border:none;
            border-radius:12px;
            background:#1e3a8a;
            color:white;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#162c6d;
            transform:translateY(-2px);
        }

        .create{
            text-align:center;
            margin-top:18px;
            font-size:14px;
        }

        .create a{
            color:#16a34a;
            font-weight:bold;
            text-decoration:none;
        }

        .msg{
            text-align:center;
            margin-bottom:15px;
            color:#dc2626;
            font-size:14px;
            min-height:18px;
        }

        .footer{
            margin-top:24px;
            text-align:center;
            font-size:12px;
            color:#777;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">

        <div class="logo">
            <h1>Van<span>Protege</span></h1>
            <p>Sua van escolar mais segura e organizada</p>
        </div>

        <div class="msg" id="msg"></div>

        <div class="group">
            <label>Email</label>
            <input type="email" id="email" placeholder="Digite seu email">
        </div>

        <div class="group">
            <label>Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha">
        </div>

        <div class="row">
            <label>
                <input type="checkbox" id="lembrar">
                Permanecer conectado
            </label>

            <a href="#" onclick="esqueciSenha()">Esqueci a senha</a>
        </div>

        <button onclick="login()">Entrar</button>

        <div class="create">
            Não tem conta?
            <a href="cadastro-cliente.html">Criar conta</a>
        </div>

        <div class="footer">
            © 2026 VanProtege
        </div>

    </div>
</div>

<script>

    // auto login
    window.onload = function(){

        let usuario = localStorage.getItem("usuarioId");

        if(usuario){
            redirecionar();
        }

    }

    // login
    async function login(){

        let email = document.getElementById("email").value;
        let senha = document.getElementById("senha").value;
        let lembrar = document.getElementById("lembrar").checked;
        let msg = document.getElementById("msg");

        msg.innerHTML = "";

        try{

            let response = await fetch("http://localhost:8080/api/auth/login",{
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    email:email,
                    senha:senha
                })
            });

            let data = await response.json();

            if(data.sucesso){

                if(lembrar){
                    localStorage.setItem("usuarioId",data.id);
                    localStorage.setItem("nome",data.nome);
                    localStorage.setItem("role",data.role);
                }else{
                    sessionStorage.setItem("usuarioId",data.id);
                    sessionStorage.setItem("nome",data.nome);
                    sessionStorage.setItem("role",data.role);
                }

                redirecionar();

            }else{
                msg.innerHTML = "Email ou senha inválidos.";
            }

        }catch(e){
            msg.innerHTML = "Erro ao conectar servidor.";
        }

    }

    // redirecionar
    function redirecionar(){

        let role =
            localStorage.getItem("role") ||
            sessionStorage.getItem("role");

        if(role === "ADMIN"){
            window.location.href = "dashboard-admin.html";
        }else{
            window.location.href = "dashboard.html";
        }

    }

    // esqueceu senha
    function esqueciSenha(){

        let email = prompt("Digite seu email:");

        if(email){
            alert("Em breve enviaremos recuperação para: " + email);
        }

    }
</script>

</body>
</html>
