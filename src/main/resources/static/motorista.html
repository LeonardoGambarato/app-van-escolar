<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motoristas - App Van</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f6fb;
            display:flex;
            color:#1e293b;
        }

        /* MENU */
        .sidebar{
            width:230px;
            height:100vh;
            background:linear-gradient(180deg,#0f172a,#1e293b);
            padding:30px 20px;
            position:fixed;
            left:0;
            top:0;
        }

        .logo{
            font-size:20px;
            font-weight:bold;
            color:#fff;
            margin-bottom:35px;
        }

        .menu a{
            display:block;
            color:#e2e8f0;
            text-decoration:none;
            padding:14px;
            margin-bottom:10px;
            border-radius:10px;
            transition:.2s;
        }

        .menu a:hover{
            background:#334155;
        }

        /* CONTEÚDO */
        .main{
            margin-left:230px;
            padding:28px;
            width:100%;
        }

        .topo{
            background:#fff;
            padding:24px;
            border-radius:16px;
            box-shadow:0 8px 20px rgba(0,0,0,.04);
            margin-bottom:25px;
        }

        .topo h1{
            font-size:22px;
        }

        /* CARDS */
        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
            margin-bottom:25px;
        }

        .card{
            background:#fff;
            padding:24px;
            border-radius:16px;
            box-shadow:0 8px 20px rgba(0,0,0,.04);
        }

        .card span{
            display:block;
            font-size:14px;
            color:#64748b;
            margin-bottom:8px;
        }

        .card h2{
            color:#2d89ef;
            font-size:34px;
        }

        /* BOX */
        .box{
            background:#fff;
            padding:24px;
            border-radius:16px;
            box-shadow:0 8px 20px rgba(0,0,0,.04);
            margin-bottom:25px;
        }

        .box h2{
            margin-bottom:20px;
            font-size:18px;
        }

        input{
            width:100%;
            padding:13px;
            border:1px solid #dbe2ea;
            border-radius:10px;
            margin-bottom:12px;
            outline:none;
        }

        input:focus{
            border-color:#2d89ef;
        }

        button{
            border:none;
            padding:13px;
            border-radius:10px;
            cursor:pointer;
            font-weight:bold;
            transition:.2s;
        }

        .btnSalvar{
            width:100%;
            background:#2d89ef;
            color:#fff;
        }

        .btnSalvar:hover{
            opacity:.9;
        }

        .btnEditar{
            background:#f1f5f9;
            color:#111827;
            padding:9px 14px;
            margin-right:6px;
        }

        .btnExcluir{
            background:#ef4444;
            color:#fff;
            padding:9px 14px;
        }

        /* TABELA */
        table{
            width:100%;
            border-collapse:collapse;
            margin-top:15px;
        }

        th,td{
            padding:14px;
            border-bottom:1px solid #edf2f7;
            text-align:left;
        }

        th{
            color:#64748b;
            font-size:14px;
        }

        .busca{
            margin-bottom:10px;
        }
    </style>
</head>

<body>

<div class="sidebar">

    <div class="logo">🚐 App Van</div>

    <div class="menu">
        <a href="dashboard.html">Dashboard</a>
        <a href="motorista.html">Motoristas</a>
        <a href="alunos.html">Alunos</a>
        <a href="rotas.html">Rotas</a>
        <a href="financeiro.html">Financeiro</a>
        <a href="login.html">Sair</a>
    </div>

</div>

<div class="main">

    <div class="topo">
        <h1>Gestão de Motoristas</h1>
    </div>

    <div class="cards">
        <div class="card">
            <span>Total Motoristas</span>
            <h2 id="totalMotoristas">0</h2>
        </div>

        <div class="card">
            <span>Vans Ativas</span>
            <h2 id="vansAtivas">0</h2>
        </div>

        <div class="card">
            <span>Capacidade Total</span>
            <h2 id="capacidadeTotal">0</h2>
        </div>
    </div>

    <div class="box">
        <h2>Cadastrar Motorista</h2>

        <input type="hidden" id="id">

        <input id="nome" placeholder="Nome">
        <input id="telefone" placeholder="Telefone">
        <input id="email" placeholder="Email">
        <input id="cpf" placeholder="CPF">
        <input id="placaVan" placeholder="Placa da Van">
        <input id="capacidade" placeholder="Capacidade">

        <button class="btnSalvar" onclick="salvar()">Salvar</button>
    </div>

    <div class="box">

        <h2>Lista de Motoristas</h2>

        <input class="busca" id="busca" placeholder="Buscar motorista..." onkeyup="listar()">

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Telefone</th>
                <th>Placa</th>
                <th>Ação</th>
            </tr>
            </thead>

            <tbody id="tabela"></tbody>

        </table>

    </div>

</div>

<script>

    function salvar(){

        let motorista = {
            id: id.value || null,
            nome: nome.value,
            telefone: telefone.value,
            email: email.value,
            cpf: cpf.value,
            placaVan: placaVan.value,
            capacidade: capacidade.value,
            ativo:true
        };

        fetch("/motoristas",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify(motorista)
        })
            .then(()=>{

                limpar();
                listar();

            });

    }

    function listar(){

        fetch("/motoristas")
            .then(r=>r.json())
            .then(lista=>{

                let termo = busca.value.toLowerCase();

                if(termo){
                    lista = lista.filter(m =>
                        m.nome.toLowerCase().includes(termo)
                    );
                }

                let html = "";

                let total = lista.length;
                let ativos = 0;
                let capacidadeTotal = 0;

                lista.forEach(m=>{

                    if(m.ativo) ativos++;

                    capacidadeTotal += Number(m.capacidade || 0);

                    html += `
<tr>
<td>${m.id}</td>
<td>${m.nome}</td>
<td>${m.telefone || ''}</td>
<td>${m.placaVan || ''}</td>
<td>
<button class="btnEditar" onclick="editar(${m.id})">Editar</button>
<button class="btnExcluir" onclick="excluirMotorista(${m.id})">Excluir</button>
</td>
</tr>
`;

                });

                tabela.innerHTML = html;

                totalMotoristas.innerHTML = total;
                vansAtivas.innerHTML = ativos;
                capacidadeTotal.innerHTML = capacidadeTotal;

            });

    }

    function editar(idBusca){

        fetch("/motoristas")
            .then(r=>r.json())
            .then(lista=>{

                let m = lista.find(x => x.id == idBusca);

                id.value = m.id;
                nome.value = m.nome;
                telefone.value = m.telefone;
                email.value = m.email;
                cpf.value = m.cpf;
                placaVan.value = m.placaVan;
                capacidade.value = m.capacidade;

                window.scrollTo({
                    top:0,
                    behavior:"smooth"
                });

            });

    }

    function excluirMotorista(id){

        fetch("/motoristas/" + id,{
            method:"DELETE"
        })
            .then(()=>listar());

    }

    function limpar(){

        id.value="";
        nome.value="";
        telefone.value="";
        email.value="";
        cpf.value="";
        placaVan.value="";
        capacidade.value="";

    }

    listar();

</script>

</body>
</html>
