<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotas</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:#f5f7fb;
            display:flex;
            color:#1f2937;
        }

        .sidebar{
            width:250px;
            height:100vh;
            background:linear-gradient(180deg,#111827,#1f2937);
            padding:25px;
            position:fixed;
            left:0;
            top:0;
        }

        .logo{
            color:white;
            font-size:28px;
            font-weight:bold;
            margin-bottom:35px;
            text-align:center;
        }

        .menu a{
            display:block;
            padding:14px;
            margin-bottom:10px;
            text-decoration:none;
            color:#d1d5db;
            border-radius:10px;
            transition:0.2s;
        }

        .menu a:hover{
            background:#374151;
            color:white;
        }

        .main{
            margin-left:250px;
            width:100%;
            padding:30px;
        }

        .topbar{
            background:white;
            padding:18px 25px;
            border-radius:14px;
            box-shadow:0 5px 18px rgba(0,0,0,0.05);
            margin-bottom:25px;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
            margin-bottom:25px;
        }

        .card{
            background:white;
            padding:22px;
            border-radius:16px;
            box-shadow:0 8px 20px rgba(0,0,0,0.05);
        }

        .card h3{
            font-size:14px;
            color:#6b7280;
            margin-bottom:8px;
        }

        .card p{
            font-size:30px;
            font-weight:bold;
            color:#2d89ef;
        }

        .box{
            background:white;
            padding:25px;
            border-radius:16px;
            box-shadow:0 8px 20px rgba(0,0,0,0.05);
        }

        select{
            padding:10px;
            border-radius:10px;
            border:1px solid #ddd;
            margin-bottom:15px;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th,td{
            padding:14px;
            border-bottom:1px solid #eee;
            text-align:left;
        }

        th{
            color:#6b7280;
            font-size:14px;
        }

        button{
            border:none;
            padding:8px 12px;
            border-radius:8px;
            cursor:pointer;
            color:white;
            font-weight:bold;
            margin-right:5px;
        }

        .embarque{background:#2d89ef;}
        .entregue{background:#10b981;}
        .faltou{background:#ef4444;}
    </style>
</head>

<body>

<div class="sidebar">

    <div class="logo">🚐 App Van</div>

    <div class="menu">
        <a href="dashboard.html">Dashboard</a>
        <a href="motorista.html">Motoristas</a>
        <a href="alunos.html">Alunos</a>
        <a href="rotas.html">Rotas</a>
        <a href="financeiro.html">Financeiro</a>
        <a href="login.html">Sair</a>
    </div>

</div>

<div class="main">

    <div class="topbar">
        <h1>Rotas do Dia</h1>
    </div>

    <div class="cards">

        <div class="card">
            <h3>Total Alunos</h3>
            <p id="total">0</p>
        </div>

        <div class="card">
            <h3>Embarcados</h3>
            <p id="embarcados">0</p>
        </div>

        <div class="card">
            <h3>Entregues</h3>
            <p id="entregues">0</p>
        </div>

        <div class="card">
            <h3>Faltaram</h3>
            <p id="faltaram">0</p>
        </div>

    </div>

    <div class="box">

        <select id="filtroTurno" onchange="carregar()">
            <option value="">Todos os turnos</option>
            <option value="manha">Manhã</option>
            <option value="tarde">Tarde</option>
            <option value="integral">Integral</option>
        </select>

        <table>

            <thead>
            <tr>
                <th>Ordem</th>
                <th>Aluno</th>
                <th>Endereço</th>
                <th>Escola</th>
                <th>Turno</th>
                <th>Ações</th>
            </tr>
            </thead>

            <tbody id="tabela"></tbody>

        </table>

    </div>

</div>

<script>

    let statusRota = {};

    function carregar(){

        fetch("/alunos")
            .then(r=>r.json())
            .then(lista=>{

                let turno = filtroTurno.value;

                if(turno){
                    lista = lista.filter(a =>
                        (a.turno || "").toLowerCase().includes(turno)
                    );
                }

                lista.sort((a,b)=>(a.ordemRota || 999) - (b.ordemRota || 999));

                let html = "";

                let embarcados = 0;
                let entregues = 0;
                let faltaram = 0;

                lista.forEach(a=>{

                    let status = statusRota[a.id];

                    if(status=="EMBARCOU") embarcados++;
                    if(status=="ENTREGUE") entregues++;
                    if(status=="FALTOU") faltaram++;

                    html += `
<tr>
<td>${a.ordemRota || ""}</td>
<td>${a.nome}</td>
<td>${a.endereco || ""}</td>
<td>${a.escola || ""}</td>
<td>${a.turno || ""}</td>
<td>
<button class="embarque" onclick="marcar(${a.id},'EMBARCOU')">Embarcou</button>
<button class="entregue" onclick="marcar(${a.id},'ENTREGUE')">Entregue</button>
<button class="faltou" onclick="marcar(${a.id},'FALTOU')">Faltou</button>
</td>
</tr>
`;

                });

                tabela.innerHTML = html;

                total.innerHTML = lista.length;
                document.getElementById("embarcados").innerHTML = embarcados;
                document.getElementById("entregues").innerHTML = entregues;
                document.getElementById("faltaram").innerHTML = faltaram;

            });

    }

    function marcar(id,status){

        statusRota[id] = status;
        carregar();

    }

    carregar();

</script>

</body>
</html>
