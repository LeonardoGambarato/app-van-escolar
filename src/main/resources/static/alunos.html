<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alunos</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:#f5f7fb;
            display:flex;
            color:#1f2937;
        }

        .sidebar{
            width:250px;
            height:100vh;
            background:linear-gradient(180deg,#111827,#1f2937);
            padding:25px;
            position:fixed;
            left:0;
            top:0;
        }

        .logo{
            color:white;
            font-size:28px;
            font-weight:bold;
            margin-bottom:35px;
            text-align:center;
        }

        .menu a{
            display:block;
            padding:14px;
            margin-bottom:10px;
            text-decoration:none;
            color:#d1d5db;
            border-radius:10px;
            transition:0.2s;
        }

        .menu a:hover{
            background:#374151;
            color:white;
        }

        .main{
            margin-left:250px;
            width:100%;
            padding:30px;
        }

        .topbar{
            background:white;
            padding:18px 25px;
            border-radius:14px;
            box-shadow:0 5px 18px rgba(0,0,0,0.05);
            margin-bottom:25px;
        }

        .topbar h1{
            font-size:28px;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
            margin-bottom:25px;
        }

        .card{
            background:white;
            padding:22px;
            border-radius:16px;
            box-shadow:0 8px 20px rgba(0,0,0,0.05);
        }

        .card h3{
            font-size:14px;
            color:#6b7280;
            margin-bottom:8px;
        }

        .card p{
            font-size:30px;
            font-weight:bold;
            color:#2d89ef;
        }

        .card-form{
            background:white;
            padding:30px;
            border-radius:18px;
            box-shadow:0 10px 30px rgba(0,0,0,.05);
            margin-top:20px;
        }

        .card-form h2{
            margin-bottom:18px;
            font-size:22px;
            color:#0f172a;
        }

        input, select{
            width:100%;
            padding:13px 14px;
            margin-bottom:12px;
            border:1px solid #dbe2ea;
            border-radius:12px;
            font-size:14px;
            outline:none;
            transition:.2s;
            background:white;
        }

        input:focus, select:focus{
            border-color:#2d89ef;
            box-shadow:0 0 0 4px rgba(45,137,239,.10);
        }

        .box{
            background:white;
            padding:25px;
            border-radius:16px;
            box-shadow:0 8px 20px rgba(0,0,0,0.05);
            margin-bottom:25px;
        }

        button{
            padding:12px;
            border:none;
            border-radius:10px;
            cursor:pointer;
            font-weight:bold;
        }

        #btnSalvar{
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            background:#2d89ef;
            color:white;
            font-weight:700;
            font-size:15px;
            cursor:pointer;
            margin-top:8px;
            transition:.2s;
        }

        #btnSalvar:hover{
            background:#1f6ed4;
            transform:translateY(-1px);
            box-shadow:0 10px 20px rgba(45,137,239,.20);
        }

        .editar{
            background:#f59e0b;
            color:white;
            border:none;
            padding:8px 14px;
            border-radius:10px;
            cursor:pointer;
            margin-right:6px;
        }

        .excluir{
            background:#ef4444;
            color:white;
            border:none;
            padding:8px 14px;
            border-radius:10px;
            cursor:pointer;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            border-radius:16px;
            overflow:hidden;
        }

        th{
            text-align:left;
            padding:16px;
            color:#64748b;
            font-size:14px;
            border-bottom:1px solid #eef2f7;
        }

        td{
            padding:16px;
            border-bottom:1px solid #f1f5f9;
        }

        tr:hover{
            background:#f8fafc;
        }
        select{
            width:100%;
            padding:12px;
            margin-bottom:12px;
            border:1px solid #ddd;
            border-radius:10px;
        }

        .grid{
            display:grid;
            grid-template-columns: 1fr 1.4fr;
            gap:20px;
            margin-top:20px;
        }

        @media(max-width:900px){
            .grid{
                grid-template-columns:1fr;
            }
        }

    </style>
</head>

<body>

<div class="sidebar">

    <div class="logo">🚐 App Van</div>

    <div class="menu">
        <a href="dashboard.html">Dashboard</a>
        <a href="motorista.html">Motoristas</a>
        <a href="alunos.html">Alunos</a>
        <a href="rotas.html">Rotas</a>
        <a href="financeiro.html">Financeiro</a>
        <a href="login.html">Sair</a>
    </div>

</div>

<div class="main">

    <div class="topbar">
        <h1>Gestão de Alunos</h1>
    </div>

    <div class="cards">

        <div class="card">
            <h3>Total Alunos</h3>
            <span id="totalAlunos">0</span>
        </div>

        <div class="card">
            <h3>Manhã</h3>
            <span id="manha">0</span>
        </div>

        <div class="card">
            <h3>Tarde</h3>
            <span id="tarde">0</span>
        </div>

        <div class="card">
            <h3>Integral</h3>
            <span id="integral">0</span>
        </div>

    </div>
</div>

<div class="grid">

    <!-- FORMULÁRIO -->
    <div class="card-form">

        <h2>Cadastrar Aluno</h2>

        <input type="text" id="nome" placeholder="Nome do aluno">
        <input type="text" id="responsavel" placeholder="Responsável">
        <input type="text" id="telefoneResponsavel" placeholder="Telefone responsável">
        <input type="text" id="endereco" placeholder="Endereço">
        <input type="text" id="escola" placeholder="Escola">

        <select id="turno">
            <option value="">Selecione o turno</option>
            <option value="manha">Manhã</option>
            <option value="tarde">Tarde</option>
            <option value="integral">Integral</option>
        </select>

        <input type="number" id="mensalidade" placeholder="Mensalidade">
        <input type="number" id="diaVencimento" placeholder="Dia do vencimento (1 a 31)">

        <button id="btnSalvar" onclick="salvar()">Salvar</button>

    </div>

    <!-- LISTA -->
    <div class="box">

        <h2>Lista de Alunos</h2>

        <input type="text" id="busca" placeholder="Buscar aluno..." onkeyup="filtrar()">

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Aluno</th>
                <th>Responsável</th>
                <th>Escola</th>
                <th>Ação</th>
            </tr>
            </thead>

            <tbody id="tabela"></tbody>
        </table>

    </div>

</div>


<script>
    let listaGlobal = [];
    let editandoId = null;

    async function salvar(){

        let coords = await buscarCoordenadas(endereco.value);

        if(!coords){
            alert("Endereço inválido ou não encontrado.");
            return;
        }

        let aluno = {
            nome: nome.value,
            responsavel: responsavel.value,
            telefoneResponsavel: telefoneResponsavel.value,
            endereco: endereco.value,
            escola: escola.value,
            turno: turno.value,
            mensalidade: mensalidade.value,
            diaVencimento: diaVencimento.value,
            latitude: coords.lat,
            longitude: coords.lon
        };

        let metodo = "POST";
        let url = "/alunos";

        if(editandoId != null){
            aluno.id = editandoId;
            metodo = "PUT";
            url = "/alunos/" + editandoId;
        }

        fetch(url,{
            method: metodo,
            headers:{
                "Content-Type":"application/json"
            },
            body: JSON.stringify(aluno)
        })
            .then(()=>{
                limparCampos();
                editandoId = null;
                btnSalvar.innerHTML = "Salvar Aluno";
                carregar();
                alert("Aluno salvo com coordenadas!");
            });

    }

    function editar(id){

        let aluno = listaGlobal.find(a => a.id == id);

        nome.value = aluno.nome || "";
        responsavel.value = aluno.responsavel || "";
        telefoneResponsavel.value = aluno.telefoneResponsavel || "";
        endereco.value = aluno.endereco || "";
        escola.value = aluno.escola || "";
        turno.value = aluno.turno || "";
        mensalidade.value = aluno.mensalidade || "";
        diaVencimento.value = aluno.diaVencimento || "";

        editandoId = id;

        document.getElementById("btnSalvar").innerHTML = "Atualizar Aluno";
    }

    function carregar(){

        fetch("/alunos")
            .then(r => r.json())
            .then(lista => {

                listaGlobal = lista;

                renderizar(lista);

                let total = lista.length;
                let manha = 0;
                let tarde = 0;
                let integral = 0;

                lista.forEach(a => {

                    let turno = (a.turno || "").toUpperCase().trim();

                    if(turno == "MANHA"){
                        manha++;
                    }

                    if(turno == "TARDE"){
                        tarde++;
                    }

                    if(turno == "INTEGRAL"){
                        integral++;
                    }

                });

                document.getElementById("totalAlunos").innerHTML = total;
                document.getElementById("manha").innerHTML = manha;
                document.getElementById("tarde").innerHTML = tarde;
                document.getElementById("integral").innerHTML = integral;

            });

    }

    function renderizar(lista){

        let html = "";

        lista.forEach(a=>{

            html += `
<tr>
<td>${a.id}</td>
<td>${a.nome}</td>
<td>${a.responsavel}</td>
<td>${a.escola}</td>
<td>
<button class="editar" onclick="editar(${a.id})">Editar</button>
<button class="excluir" onclick="excluir(${a.id})">Excluir</button>
</td>
</tr>
`;

        });

        tabela.innerHTML = html;

    }

    function excluir(id){

        fetch("/alunos/" + id,{
            method:"DELETE"
        })
            .then(()=>carregar());

    }

    function filtrar(){

        let texto = busca.value.toLowerCase();

        let filtrados = listaGlobal.filter(a =>
            a.nome.toLowerCase().includes(texto)
        );

        renderizar(filtrados);

    }

    function limparCampos(){

        nome.value = "";
        responsavel.value = "";
        telefoneResponsavel.value = "";
        endereco.value = "";
        escola.value = "";
        turno.value = "";
        mensalidade.value = "";
        diaVencimento.value = "";

    }

    carregar();

    async function buscarCoordenadas(endereco){

        let url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&q="
            + encodeURIComponent(endereco);

        let resposta = await fetch(url);

        let dados = await resposta.json();

        if(dados.length > 0){

            return {
                lat: dados[0].lat,
                lon: dados[0].lon
            };

        }

        return null;
    }

</script>

</body>
</html>
